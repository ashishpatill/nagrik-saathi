name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate playbooks
        run: pnpm playbooks:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit (high and critical)
        run: pnpm audit --audit-level high

      - name: Generate CycloneDX SBOM
        run: pnpm sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.json
          if-no-files-found: error
          retention-days: 30

  # Lighthouse is intentionally not run here: the report depends on a live
  # preview deployment and a Chrome runner. Run `pnpm build && pnpm start`
  # then Lighthouse against localhost before a release. The Stage 0 exit
  # criterion is still manual until a preview environment is wired up.
